# Beloved companion server — Cloudflare Worker. Deploy steps: README.md.
name = "beloved-companion"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Fails closed: until these are set the server answers 503 to every companion request.
BUNDLE_ID = "com.vaibhavsg.beloved"
PRODUCT_IDS = "beloved.premium.monthly,beloved.premium.annual"
ENVIRONMENTS = "Production"   # add ",Sandbox" only for TestFlight testing, then remove
MODEL = "gemini-flash-latest"
MAX_TOKENS = "900"
DAILY_LIMIT = "100"     # Premium messages per subscriber per UTC day
FREE_DAILY_LIMIT = "10" # free messages per install per UTC day
FREE_IP_LIMIT = "40"    # free messages per network address per UTC day (reinstall abuse)

# Per-subscription daily counters (two-day expiry). Create with:
#   npx wrangler kv namespace create USAGE   → paste the id below.

# Secret (never in this file or the app):  npx wrangler secret put GEMINI_API_KEY

[[kv_namespaces]]
binding = "USAGE"
id = "d8995e5eed5c44e89c31bc5f01514407"
