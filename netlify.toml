# Netlify build for the Beloved website (static; no functions, no forms, no analytics).
# Public values (support email, legal name, terms date) are set below in [build.environment].
# Set BELOVED_DOMAIN in Netlify → Site configuration → Environment variables
# (its value is the assigned Netlify URL, e.g. https://<site-name>.netlify.app).
#   optional: BELOVED_APP_STORE_URL, BELOVED_CONTACT_ADDRESS, BELOVED_GOVERNING_LAW
# The build fails (and nothing is published) if a required value is missing or an example.
# Security headers come from website/public/_headers, generated by the build.
[build]
  command = "python3 website/build.py --config-env"
  publish = "website/public"

[build.environment]
  PYTHON_VERSION = "3.11"
  BELOVED_SUPPORT_EMAIL = "support.beloved@gmail.com"
  BELOVED_LEGAL_NAME = "Vaibhav S G"
  BELOVED_TERMS_EFFECTIVE_DATE = "13 October 2026"
